name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsod-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile source
        run: python -m py_compile bsod_investigator.py

      - name: Run built-in self-test
        run: python bsod_investigator.py --self-test

  package-windows:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build and smoke-test packaged EXE
        shell: cmd
        run: build_exe.bat --ci

      - name: Verify packaged artifact and create checksum
        shell: pwsh
        run: |
          $exe = 'dist\BSOD-Investigator.exe'
          if (-not (Test-Path $exe)) { throw 'EXE was not created' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BSOD-Investigator.exe" | Set-Content 'dist\BSOD-Investigator.sha256.txt' -Encoding ascii
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-Content 'dist\BSOD-Investigator.sha256.txt'

      - name: Upload packaged Windows binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BSOD-Investigator-Windows-x64
          path: |
            dist/BSOD-Investigator.exe
            dist/BSOD-Investigator.sha256.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: package-windows
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Require fresh Russian release notes on package pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -Fxq RELEASE_NOTES_RU.md || {
            echo "RELEASE_NOTES_RU.md must be updated in the same [package] commit."
            exit 1
          }

      - name: Download exact binary built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: BSOD-Investigator-Windows-x64
          path: release

      - name: Publish GitHub Release with Russian notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="build-$short_sha"
          title="BSOD Investigator — Windows-сборка $short_sha"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file RELEASE_NOTES_RU.md
            gh release upload "$tag" release/BSOD-Investigator.exe release/BSOD-Investigator.sha256.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/BSOD-Investigator.exe release/BSOD-Investigator.sha256.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" \
              --notes-file RELEASE_NOTES_RU.md --prerelease
          fi
