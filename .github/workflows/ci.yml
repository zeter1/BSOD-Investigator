name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile source
        run: python -m py_compile bsod_investigator.py

      - name: Run built-in self-test
        run: python bsod_investigator.py --self-test
